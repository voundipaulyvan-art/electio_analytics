<style>
/* ── Tokens ─────────────────────────────────────────────── */
:root {
  --bg:        #07091A;
  --bg-card:   #0D1328;
  --bg-surf:   #131D3A;
  --bg-hover:  #1A2545;
  --border:    rgba(74,122,255,.18);
  --accent:    #4A7AFF;
  --accent-lo: rgba(74,122,255,.12);
  --fg:        #E2E8F0;
  --fg-2:      #94A3B8;
  --fg-3:      #4A5A7A;
  --success:   #34D399;
  --warn:      #FBBF24;

  /* Family palette */
  --xd:        #EF4444;
  --droite:    #60A5FA;
  --centre:    #FBBF24;
  --gauche:    #F472B6;
  --gauche-r:  #A78BFA;
  --eco:       #34D399;
  --xg:        #FB923C;
  --divers:    #94A3B8;

  --sidebar-w: 220px;
  --radius:    10px;
  color-scheme: dark;
}

/* Light theme */
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg:        #F0F4FF;
    --bg-card:   #FFFFFF;
    --bg-surf:   #E8EDFB;
    --bg-hover:  #DDE4F7;
    --border:    rgba(74,122,255,.2);
    --accent:    #3B6EEF;
    --accent-lo: rgba(59,110,239,.1);
    --fg:        #111827;
    --fg-2:      #374151;
    --fg-3:      #9CA3AF;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg:        #F0F4FF;
  --bg-card:   #FFFFFF;
  --bg-surf:   #E8EDFB;
  --bg-hover:  #DDE4F7;
  --border:    rgba(74,122,255,.2);
  --accent:    #3B6EEF;
  --accent-lo: rgba(59,110,239,.1);
  --fg:        #111827;
  --fg-2:      #374151;
  --fg-3:      #9CA3AF;
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; }

body {
  background: var(--bg);
  color: var(--fg);
  font-family: 'Poppins', system-ui, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  display: flex;
}

/* ── Layout ─────────────────────────────────────────────── */
#root { display: flex; width: 100%; min-height: 100%; }

.sidebar {
  position: fixed; top: 0; left: 0; bottom: 0;
  width: var(--sidebar-w);
  background: var(--bg-card);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  z-index: 10; overflow-y: auto;
}

.sidebar-logo {
  padding: 20px 16px 16px;
  border-bottom: 1px solid var(--border);
}
.sidebar-logo-title {
  font-family: 'Poppins', sans-serif;
  font-weight: 800; font-size: 17px;
  color: var(--fg); letter-spacing: -.3px;
  line-height: 1.2;
}
.sidebar-logo-sub {
  font-size: 11px; color: var(--accent);
  font-weight: 600; letter-spacing: .6px;
  text-transform: uppercase; margin-top: 3px;
}

.sidebar-nav { flex: 1; padding: 10px 8px; }

.nav-section-label {
  font-size: 10px; font-weight: 600; letter-spacing: 1px;
  text-transform: uppercase; color: var(--fg-3);
  padding: 12px 8px 4px;
}

.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 10px; border-radius: 7px;
  cursor: pointer; color: var(--fg-2);
  font-size: 13px; font-weight: 500;
  transition: background .15s, color .15s;
  border: none; background: none; width: 100%; text-align: left;
}
.nav-item:hover { background: var(--bg-hover); color: var(--fg); }
.nav-item.active { background: var(--accent-lo); color: var(--accent); }
.nav-item { position: relative; overflow: hidden; }
.nav-item::after { content:""; position:absolute; inset:0; background:var(--accent); opacity:0; border-radius:7px; transform:scaleX(0); transform-origin:left; transition:transform .2s ease,opacity .2s ease; }
.nav-item:active::after { transform:scaleX(1); opacity:.08; }
.nav-item svg { flex-shrink: 0; }

.sidebar-footer {
  padding: 12px 14px;
  border-top: 1px solid var(--border);
  font-size: 11px; color: var(--fg-3);
}
.tech-badges { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.tech-badge {
  background: var(--bg-surf); border: 1px solid var(--border);
  color: var(--fg-2); font-size: 10px; padding: 2px 6px;
  border-radius: 4px; font-weight: 500;
}

.main {
  margin-left: var(--sidebar-w);
  flex: 1; min-width: 0;
  display: flex; flex-direction: column;
}

.topbar {
  position: sticky; top: 0;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: 12px max(20px, env(safe-area-inset-right, 0px)) 12px max(20px, env(safe-area-inset-left, 0px));
  display: flex; align-items: center; justify-content: space-between;
  z-index: 5;
}
.topbar-title {
  font-family: 'Poppins', sans-serif;
  font-weight: 700; font-size: 16px;
}
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11px; font-weight: 600; letter-spacing: .3px;
  padding: 3px 8px; border-radius: 20px;
}
.badge-blue { background: var(--accent-lo); color: var(--accent); border: 1px solid rgba(74,122,255,.3); }
.badge-green { background: rgba(52,211,153,.12); color: var(--success); border: 1px solid rgba(52,211,153,.3); }

.page-content {
  flex: 1;
  padding: 24px max(20px, env(safe-area-inset-right, 0px)) 40px max(20px, env(safe-area-inset-left, 0px));
}

/* ── Cards / Grid ───────────────────────────────────────── */
.kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 24px; }
.kpi-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 18px 20px;
  display: flex; flex-direction: column; gap: 4px;
  transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
}
.kpi-card:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(74,122,255,.12); border-color: rgba(74,122,255,.4); }
.kpi-label { font-size: 11px; color: var(--fg-3); font-weight: 600; letter-spacing: .5px; text-transform: uppercase; }
.kpi-value { font-family: 'Poppins', sans-serif; font-size: 28px; font-weight: 800; line-height: 1; color: var(--fg); font-variant-numeric: tabular-nums; }
.kpi-sub { font-size: 12px; color: var(--fg-2); }

.card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 20px;
  transition: border-color .2s ease, box-shadow .2s ease;
}
.card:hover { border-color: rgba(74,122,255,.35); box-shadow: 0 4px 24px rgba(74,122,255,.08); }
.card-title {
  font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 14px;
  margin-bottom: 4px;
}
.card-sub { font-size: 12px; color: var(--fg-2); margin-bottom: 16px; }

.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
.three-col { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; margin-bottom: 14px; }
.full-col { margin-bottom: 14px; }

/* ── Family pill ────────────────────────────────────────── */
.family-pill {
  display: inline-block; padding: 2px 8px; border-radius: 20px;
  font-size: 11px; font-weight: 600; white-space: nowrap;
}

/* ── Table ──────────────────────────────────────────────── */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th {
  text-align: left; padding: 8px 10px;
  font-size: 10px; font-weight: 600; letter-spacing: .6px;
  text-transform: uppercase; color: var(--fg-3);
  border-bottom: 1px solid var(--border);
  background: var(--bg-surf);
  position: sticky; top: 0;
}
td { padding: 7px 10px; border-bottom: 1px solid rgba(255,255,255,.04); vertical-align: middle; }
tr:hover td { background: var(--bg-hover); }
.number-cell { font-variant-numeric: tabular-nums; text-align: right; }

/* ── Search & filters ───────────────────────────────────── */
.search-row { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.search-input {
  flex: 1; min-width: 200px; padding: 8px 12px;
  background: var(--bg-surf); border: 1px solid var(--border);
  border-radius: 7px; color: var(--fg); font-size: 13px;
  outline: none; transition: border-color .15s;
}
.search-input:focus { border-color: var(--accent); }
.filter-select {
  padding: 8px 12px; background: var(--bg-surf); border: 1px solid var(--border);
  border-radius: 7px; color: var(--fg); font-size: 13px;
  cursor: pointer; outline: none;
}

/* ── SVG Charts ─────────────────────────────────────────── */
.chart-tooltip {
  position: absolute; pointer-events: none;
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 7px; padding: 8px 12px;
  font-size: 12px; box-shadow: 0 4px 20px rgba(0,0,0,.4);
  z-index: 100; min-width: 120px;
}
.tt-row { display: flex; align-items: center; gap: 6px; margin: 2px 0; }
.tt-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

/* ── Simulateur sliders ─────────────────────────────────── */
.sim-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
.slider-block { display: flex; flex-direction: column; gap: 6px; }
.slider-label { font-size: 12px; color: var(--fg-2); font-weight: 500; display: flex; justify-content: space-between; }
.slider-value { color: var(--accent); font-weight: 600; font-variant-numeric: tabular-nums; }
input[type=range] { width: 100%; accent-color: var(--accent); cursor: pointer; }

.prediction-box {
  background: var(--bg-surf); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 20px; margin-top: 16px;
  display: flex; gap: 20px; align-items: center; flex-wrap: wrap;
}
.pred-family { font-family: 'Poppins', sans-serif; font-size: 24px; font-weight: 800; }
.pred-conf { font-size: 12px; color: var(--fg-2); }
.conf-bar-wrap { flex: 1; min-width: 180px; }
.conf-bar-bg { background: var(--bg-hover); border-radius: 4px; height: 6px; overflow: hidden; margin-top: 4px; }
.conf-bar-fill { height: 100%; border-radius: 4px; transition: width .4s ease; }

/* ── Legend ─────────────────────────────────────────────── */
.legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
.legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--fg-2); }
.legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

/* ── ML pipeline ────────────────────────────────────────── */
.pipeline { display: flex; align-items: center; gap: 0; flex-wrap: wrap; margin: 16px 0; }
.pipe-step {
  background: var(--bg-surf); border: 1px solid var(--border);
  border-radius: 7px; padding: 10px 14px; font-size: 12px;
  text-align: center; min-width: 100px;
}
.pipe-step strong { display: block; font-weight: 600; font-size: 11px; color: var(--accent); margin-bottom: 2px; }
.pipe-arrow { color: var(--fg-3); font-size: 18px; padding: 0 6px; }

/* ── Progress bar ───────────────────────────────────────── */
.prog-row { display: flex; align-items: center; gap: 10px; margin: 6px 0; }
.prog-label { font-size: 12px; color: var(--fg-2); width: 160px; flex-shrink: 0; }
.prog-bar-bg { flex: 1; background: var(--bg-surf); border-radius: 4px; height: 8px; overflow: hidden; }
.prog-bar-fill { height: 100%; border-radius: 4px; }
.prog-val { font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; width: 42px; text-align: right; color: var(--fg); }

/* ── Responsive ─────────────────────────────────────────── */
@media (max-width: 768px) {
  :root { --sidebar-w: 0px; }
  .sidebar { transform: translateX(-220px); transition: transform .25s; }
  .sidebar.open { transform: translateX(0); width: 220px; }
  .main { margin-left: 0; }
  .kpi-grid { grid-template-columns: 1fr 1fr; }
  .two-col, .three-col { grid-template-columns: 1fr; }
  .sim-grid { grid-template-columns: 1fr; }
  .mobile-toggle {
    display: flex; align-items: center; justify-content: center;
    width: 36px; height: 36px; border-radius: 7px;
    background: var(--bg-surf); border: 1px solid var(--border);
    cursor: pointer; color: var(--fg);
  }
}
@media (min-width: 769px) {
  .mobile-toggle { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}

/* ── Animations ──────────────────────────────────────────── */
@keyframes fadeUp   { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
@keyframes fadeIn   { from { opacity:0; } to { opacity:1; } }
@keyframes scaleIn  { from { opacity:0; transform:scale(.85); } to { opacity:1; transform:scale(1); } }

function FamilyPill({ family }) {
  if (!family) return null;
  const col = getFamilyColor(family);
  return (
    <span className="family-pill" style={{

      border: `1px solid ${col}40`

}

function StackedBarChart({ data, keys, colors, height=240 }) {
  const [tooltip, setTooltip] = React.useState(null);
  const [mounted, setMounted] = React.useState(false);
  const PAD = { l:36, r:16, t:16, b:36 };
  const W = 500, H = height;
  const max = Math.max(...data.map(d => keys.reduce((s,k)=> s+(d[k]||0),0)));
  const bw = 60, gap = (W - PAD.l - PAD.r - bw*data.length) / (data.length+1);

  React.useEffect(() => {
    const id = requestAnimationFrame(() => setMounted(true));
    return () => cancelAnimationFrame(id);
  }, []);

  return (
    <div style={{position:"relative"}}>
      <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:"auto",overflow:"visible"}}>
        {/* Y grid */}
        {[0,.25,.5,.75,1].map(t => {
          const y = PAD.t + (H-PAD.t-PAD.b)*(1-t);
          return <g key={t}>
            <line x1={PAD.l} x2={W-PAD.r} y1={y} y2={y} stroke="rgba(255,255,255,.06)" strokeWidth="1"/>
            <text x={PAD.l-6} y={y+4} textAnchor="end" fill="#4A5A7A" fontSize="10">
              {Math.round(max*t)}
            </text>
          </g>;
        })}
        {/* Bars */}
        {data.map((d, i) => {
          const x = PAD.l + gap + i*(bw+gap);
          let cy = H - PAD.b;
          return (
            <g key={i}>
              {keys.map((k, ki) => {
                const val = d[k] || 0;
                const barH = val/max * (H-PAD.t-PAD.b);
                cy -= barH;
                const delay = (i * 0.12 + ki * 0.04).toFixed(2);
                return (
                  <rect key={k} x={x} y={cy} width={bw} height={Math.max(barH,0)}
                    fill={colors[k]} rx="3"
                    onMouseEnter={e => setTooltip({d, x:e.clientX, y:e.clientY})}
                    onMouseLeave={() => setTooltip(null)}
                    style={{
                      cursor:"pointer",
                      transformOrigin:`${x+bw/2}px ${H-PAD.b}px`,
                      transform: mounted ? "scaleY(1)" : "scaleY(0)",
                      transition:`transform .65s cubic-bezier(.34,1.4,.64,1) ${delay}s`
                    }}
                  />
                );
              })}
              <text x={x+bw/2} y={H-PAD.b+14} textAnchor="middle" fill="#94A3B8" fontSize="11">{d.annee}</text>
            </g>
          );
        })}
      </svg>
      {tooltip && (
        <div className="chart-tooltip" style={{left:tooltip.x+10, top:tooltip.y-10, position:"fixed"}}>
          <div style={{fontWeight:600,marginBottom:4}}>{tooltip.d.annee}</div>
          {keys.map(k => tooltip.d[k] > 0 && (
            <div className="tt-row" key={k}>
              <span className="tt-dot" style={{background:colors[k]}}/>

              <span style={{fontWeight:600}}>{tooltip.d[k]}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function HBarChart({ data, labelKey, valueKey, color="#4A7AFF", maxVal }) {

function DonutChart({ data, size=180 }) {
  const [hovered, setHovered] = React.useState(null);
  const total = data.reduce((s,d)=>s+d.value,0);
  let angle = -Math.PI/2;
  const R=70, r=42, cx=size/2, cy=size/2;
  const slices = data.map(d => {
    const a0 = angle;
    const a1 = angle + (d.value/total)*2*Math.PI;
    angle = a1;
    const x0=cx+R*Math.cos(a0), y0=cy+R*Math.sin(a0);
    const x1=cx+R*Math.cos(a1), y1=cy+R*Math.sin(a1);
    const ix0=cx+r*Math.cos(a0), iy0=cy+r*Math.sin(a0);
    const ix1=cx+r*Math.cos(a1), iy1=cy+r*Math.sin(a1);
    const large = (a1-a0)>Math.PI?1:0;
    const path = `M${ix0},${iy0} L${x0},${y0} A${R},${R} 0 ${large} 1 ${x1},${y1} L${ix1},${iy1} A${r},${r} 0 ${large} 0 ${ix0},${iy0} Z`;
    return {...d, path};
  });
  const hov = hovered != null ? data[hovered] : null;
  const [mounted, setMounted] = React.useState(false);
  React.useEffect(() => { const t = setTimeout(() => setMounted(true), 80); return () => clearTimeout(t); }, []);
  return (
    <svg viewBox={`0 0 ${size} ${size}`} style={{width:size,height:size}}>
      {slices.map((s,i) => (
        <path key={i} d={s.path} fill={s.color}
          opacity={hovered===null||hovered===i ? (mounted ? 1 : 0) : 0.5}
          onMouseEnter={()=>setHovered(i)}
          onMouseLeave={()=>setHovered(null)}
          style={{
            cursor:"pointer",
            transformOrigin:`${size/2}px ${size/2}px`,
            transform: mounted ? "scale(1)" : "scale(0.4)",
            transition:`transform .55s cubic-bezier(.34,1.4,.64,1) ${(i*0.07).toFixed(2)}s, opacity .4s ease ${(i*0.07).toFixed(2)}s`
          }}
        />
      ))}
      {hov ? (
        <>
          <text x={cx} y={cy-6} textAnchor="middle" fill="#E2E8F0" fontSize="18" fontFamily="Poppins" fontWeight="800">{hov.value}</text>
          <text x={cx} y={cy+10} textAnchor="middle" fill="#94A3B8" fontSize="8">{hov.label}</text>
        </>
      ) : (
        <>
          <text x={cx} y={cy-4} textAnchor="middle" fill="#E2E8F0" fontSize="14" fontFamily="Poppins" fontWeight="800">{total}</text>
          <text x={cx} y={cy+10} textAnchor="middle" fill="#94A3B8" fontSize="8">communes</text>
        </>
      )}
    </svg>
  );
}

function ParticipationChart({ data, height=200 }) {
  const PAD = {l:40,r:12,t:12,b:48};
  const W=500, H=height;
  const typeColor = {pres:"#4A7AFF", legi:"#FBBF24", euro:"#34D399"};
  const max=100;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:"auto"}}>
      {[0,25,50,75,100].map(v=>{
        const y=PAD.t+(H-PAD.t-PAD.b)*(1-v/max);
        return <g key={v}>
          <line x1={PAD.l} x2={W-PAD.r} y1={y} y2={y} stroke="rgba(255,255,255,.06)" strokeWidth="1"/>
          <text x={PAD.l-6} y={y+4} textAnchor="end" fill="#4A5A7A" fontSize="10">{v}%</text>
        </g>;
      })}
      {data.map((d,i)=>{
        const bw=38;
        const totalW=W-PAD.l-PAD.r;
        const x=PAD.l + (i/(data.length-1))*(totalW-bw);
        const barH=(d.p/max)*(H-PAD.t-PAD.b);
        const y=PAD.t+(H-PAD.t-PAD.b)-barH;
        const col=typeColor[d.type]||"#94A3B8";
        return (
          <g key={i}>
            <rect x={x} y={y} width={bw} height={barH} fill={col} rx="3" opacity="0.85"
              style={{transformOrigin:`${x+bw/2}px ${H-PAD.b}px`,animation:`growBarAnim .65s cubic-bezier(.34,1.4,.64,1) ${(i*0.09).toFixed(2)}s both`}}
            />
            <text x={x+bw/2} y={y-5} textAnchor="middle" fill={col} fontSize="10" fontWeight="600">{d.p}%</text>
            <text x={x+bw/2} y={H-PAD.b+14} textAnchor="middle" fill="#94A3B8" fontSize="9" transform={`rotate(-30,${x+bw/2},${H-PAD.b+14})`}>{d.label}</text>
          </g>
        );
      })}
    </svg>
  );
}

function AnimatedBar({ pct, color, delay=0 }) {
  const [w, setW] = React.useState(0);
  React.useEffect(() => {
    const t = setTimeout(() => setW(pct), delay + 60);
    return () => clearTimeout(t);
  }, [pct, delay]);
  return React.createElement("div", {
    style:{width:w+"%",height:"100%",background:color,borderRadius:4,transition:"width .7s cubic-bezier(.22,1,.36,1)"}
  });
}
function CountUp({ to, duration=900 }) {
  const [val, setVal] = React.useState(0);
  React.useEffect(() => {
    const start = performance.now();
    function tick(now) {
      const t = Math.min(1, (now - start) / duration);
      const ease = 1 - Math.pow(1 - t, 3);
      setVal(to * ease);
      if (t < 1) requestAnimationFrame(tick);
      else setVal(to);
    }
    const id = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(id);
  }, [to, duration]);
  return Number.isInteger(to) ? Math.round(val).toLocaleString("fr-FR") : val.toFixed(3);
}

function Communes() {
  const [search, setSearch] = React.useState("");
  const [filterFam, setFilterFam] = React.useState("all");
  const [sortKey, setSortKey] = React.useState("pop");
  const [sortDir, setSortDir] = React.useState(-1);
  const [page, setPage] = React.useState(0);
  const PER_PAGE = 25;

  const families = ["Extreme droite","Centre","Gauche","Gauche radicale","Droite","Ecologie","Divers"];

  const filtered = React.useMemo(() => {
    let r = COMMUNES.filter(c => {
      const q = search.toLowerCase();
      return c.nom.toLowerCase().includes(q) || c.code.includes(q);
    });
    if (filterFam !== "all") r = r.filter(c => c.legi2024 === filterFam);
    r = [...r].sort((a,b) => {
      const av = a[sortKey] ?? 0, bv = b[sortKey] ?? 0;
      return sortDir * (av > bv ? 1 : av < bv ? -1 : 0);
    });
    return r;
  }, [search, filterFam, sortKey, sortDir]);

  const paged = filtered.slice(page*PER_PAGE, (page+1)*PER_PAGE);
  const totalPages = Math.ceil(filtered.length / PER_PAGE);

  function toggleSort(k) {
    if (sortKey === k) setSortDir(d => -d);
    else { setSortKey(k); setSortDir(-1); }
    setPage(0);
  }

  function SortIcon({k}) {
    if (sortKey !== k) return <span style={{color:"var(--fg-3)"}}>↕</span>;
    return <span style={{color:"var(--accent)"}}>{sortDir>0?"↑":"↓"}</span>;
  }

  const baselineChanged = c => c.legi2024 !== c.legi2022;

  return (
    <div>
      <div className="search-row">
        <input className="search-input" placeholder="Rechercher une commune ou un code…"
          value={search} onChange={e=>{setSearch(e.target.value);setPage(0);}}/>
        <select className="filter-select" value={filterFam} onChange={e=>{setFilterFam(e.target.value);setPage(0);}}>
          <option value="all">Toutes les familles 2024</option>
          {families.map(f=><option key={f} value={f}>{f}</option>)}
        </select>
      </div>
      <div style={{fontSize:12,color:"var(--fg-3)",marginBottom:10}}>
        {filtered.length} commune{filtered.length>1?"s":""} · {filtered.filter(baselineChanged).length} basculement{filtered.filter(baselineChanged).length>1?"s":""} 2022→2024
      </div>
      <div className="card" style={{padding:0,overflow:"hidden"}}>
        <div className="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Commune</th>
                <th style={{cursor:"pointer"}} onClick={()=>toggleSort("pop")}>Population <SortIcon k="pop"/></th>
                <th>Legi 2017</th>
                <th>Legi 2022</th>
                <th>Legi 2024</th>
                <th style={{cursor:"pointer"}} onClick={()=>toggleSort("revenu")}>Rev. médian <SortIcon k="revenu"/></th>
                <th style={{cursor:"pointer"}} onClick={()=>toggleSort("chomage")}>Chômage <SortIcon k="chomage"/></th>
                <th style={{cursor:"pointer"}} onClick={()=>toggleSort("densite")}>Densité <SortIcon k="densite"/></th>
              </tr>
            </thead>
            <tbody>
              {paged.map(c => {
                const changed = baselineChanged(c);
                return (
                  <tr key={c.code}>
                    <td>
                      <div style={{display:"flex",alignItems:"center",gap:6}}>
                        {changed && <span style={{width:6,height:6,borderRadius:"50%",background:"#FBBF24",display:"inline-block",flexShrink:0}} title="Basculement 2022→2024"/>}
                        <div>
                          <div style={{fontWeight:500}}>{c.nom}</div>
                          <div style={{fontSize:11,color:"var(--fg-3)"}}>{c.code}</div>
                        </div>
                      </div>
                    </td>
                    <td className="number-cell">{c.pop > 0 ? c.pop.toLocaleString("fr-FR") : "—"}</td>
                    <td><FamilyPill family={c.legi2017}/></td>
                    <td><FamilyPill family={c.legi2022}/></td>
                    <td><FamilyPill family={c.legi2024}/></td>
                    <td className="number-cell">{c.revenu > 0 ? c.revenu.toLocaleString("fr-FR")+" €" : "—"}</td>
                    <td className="number-cell">{c.chomage > 0 ? c.chomage+"%" : "—"}</td>
                    <td className="number-cell">{c.densite > 0 ? c.densite+" /km²" : "—"}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
        {totalPages > 1 && (
          <div style={{display:"flex",alignItems:"center",gap:8,padding:"10px 16px",borderTop:"1px solid var(--border)"}}>
            <button onClick={()=>setPage(p=>Math.max(0,p-1))} disabled={page===0}
              style={{background:"var(--bg-surf)",border:"1px solid var(--border)",color:"var(--fg)",padding:"4px 10px",borderRadius:5,cursor:"pointer",fontSize:12}}>
              ←
            </button>
            <span style={{fontSize:12,color:"var(--fg-2)"}}>Page {page+1}/{totalPages} · {filtered.length} résultats</span>
            <button onClick={()=>setPage(p=>Math.min(totalPages-1,p+1))} disabled={page===totalPages-1}
              style={{background:"var(--bg-surf)",border:"1px solid var(--border)",color:"var(--fg)",padding:"4px 10px",borderRadius:5,cursor:"pointer",fontSize:12}}>
              →
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════
// PAGE: SIMULATEUR
// ══════════════════════════════════════════════════════════
function Simulateur() {
  const [revenu, setRevenu]   = React.useState(23000);
  const [chomage, setChomage] = React.useState(8);
  const [densite, setDensite] = React.useState(300);
  const [delta, setDelta]     = React.useState(0);

  const prediction = React.useMemo(() => {
    // Rule-based predictor informed by feature importance & data patterns
    let scores = {"Extreme droite":0,"Centre":0,"Gauche":0,"Droite":0,"Gauche radicale":0};
    // Revenu
    if (revenu < 19000)       scores["Extreme droite"] += 35;
    else if (revenu < 22000)  { scores["Extreme droite"] += 20; scores["Droite"] += 10; }
    else if (revenu < 26000)  { scores["Centre"] += 15; scores["Droite"] += 15; }
    else if (revenu < 30000)  { scores["Centre"] += 20; scores["Gauche"] += 10; }
    else                      { scores["Gauche"] += 25; scores["Gauche radicale"] += 10; }
    // Chômage
    if (chomage > 14)         scores["Gauche radicale"] += 20;
    else if (chomage > 10)    { scores["Extreme droite"] += 15; scores["Gauche"] += 10; }
    else if (chomage > 6)     { scores["Centre"] += 10; scores["Extreme droite"] += 8; }
    else                      scores["Centre"] += 15;
    // Densité
    if (densite > 3000)       { scores["Gauche"] += 25; scores["Gauche radicale"] += 10; }
    else if (densite > 500)   { scores["Centre"] += 15; scores["Gauche"] += 10; }
    else if (densite > 100)   { scores["Centre"] += 10; scores["Droite"] += 10; }
    else                      { scores["Extreme droite"] += 20; scores["Droite"] += 10; }
    // Delta abstention (proxy for discontent)
    if (delta > 5)            scores["Extreme droite"] += 15;
    else if (delta > 2)       { scores["Extreme droite"] += 8; scores["Centre"] += 5; }
    else if (delta < -3)      scores["Gauche radicale"] += 10;

    const total = Object.values(scores).reduce((s,v)=>s+v,0);
    const sorted = Object.entries(scores).sort((a,b)=>b[1]-a[1]);
    const winner = sorted[0][0];
    const conf = sorted[0][1]/total;

    // Find similar real communes
    const similar = COMMUNES.filter(c => c.legi2024 === winner &&
      Math.abs((c.revenu||0)-revenu) < 3000 &&
      Math.abs((c.chomage||0)-chomage) < 3
    ).slice(0,4);

    return {winner, conf, scores: sorted.map(([k,v])=>({k,v,pct:v/total})), similar};
  }, [revenu, chomage, densite, delta]);

  const winColor = getFamilyColor(prediction.winner);

  return (
    <div>
      <div className="card full-col">
        <div className="card-title">Simulateur de prédiction — Législatives</div>
        <div className="card-sub">Ajustez les indicateurs socio-économiques pour prédire la famille politique gagnante</div>
        <div className="sim-grid">
          <div className="slider-block">
            <div className="slider-label">Revenu médian <span className="slider-value">{revenu.toLocaleString("fr-FR")} €</span></div>
            <input type="range" min="13000" max="40000" step="500" value={revenu} onChange={e=>setRevenu(+e.target.value)}/>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:10,color:"var(--fg-3)"}}>
              <span>13 000 €</span><span>40 000 €</span>
            </div>
          </div>
          <div className="slider-block">
            <div className="slider-label">Taux de chômage <span className="slider-value">{chomage}%</span></div>
            <input type="range" min="1" max="25" step="0.5" value={chomage} onChange={e=>setChomage(+e.target.value)}/>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:10,color:"var(--fg-3)"}}>
              <span>1%</span><span>25%</span>
            </div>
          </div>
          <div className="slider-block">
            <div className="slider-label">Densité de population <span className="slider-value">{densite.toLocaleString("fr-FR")} /km²</span></div>
            <input type="range" min="5" max="12000" step="50" value={densite} onChange={e=>setDensite(+e.target.value)}/>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:10,color:"var(--fg-3)"}}>
              <span>5</span><span>12 000</span>
            </div>
          </div>
          <div className="slider-block">
            <div className="slider-label">Delta abstention 2017→2022 <span className="slider-value">{delta > 0 ? "+":""}{delta}pts</span></div>
            <input type="range" min="-10" max="15" step="0.5" value={delta} onChange={e=>setDelta(+e.target.value)}/>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:10,color:"var(--fg-3)"}}>
              <span>-10 pts</span><span>+15 pts</span>
            </div>
          </div>
        </div>

        <div className="prediction-box">
          <div>
            <div style={{fontSize:11,color:"var(--fg-3)",fontWeight:600,letterSpacing:.5,textTransform:"uppercase",marginBottom:4}}>Famille prédite</div>
            <div className="pred-family" style={{color:winColor}}>{prediction.winner}</div>
            <div className="pred-conf">{Math.round(prediction.conf*100)}% de confiance</div>
          </div>
          <div className="conf-bar-wrap">
            <div style={{fontSize:11,color:"var(--fg-3)",fontWeight:600,letterSpacing:.5,textTransform:"uppercase",marginBottom:8}}>Scores par famille</div>
            {prediction.scores.slice(0,5).map(({k,pct})=>(
              <div key={k} style={{marginBottom:6}}>
                <div style={{display:"flex",justifyContent:"space-between",fontSize:11,marginBottom:2}}>
                  <span style={{color:"var(--fg-2)"}}>{k}</span>
                  <span style={{fontWeight:600}}>{Math.round(pct*100)}%</span>
                </div>
                <div className="conf-bar-bg">
                  <div className="conf-bar-fill" style={{width:`${pct*100}%`,background:getFamilyColor(k)}}/>
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>

      {prediction.similar.length > 0 && (
        <div className="card">
          <div className="card-title">Communes réelles similaires</div>
          <div className="card-sub">Communes du Rhône avec des indicateurs proches ayant voté {prediction.winner}</div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(200px,1fr))",gap:10,marginTop:12}}>
            {prediction.similar.map(c=>(
              <div key={c.code} style={{background:"var(--bg-surf)",border:"1px solid var(--border)",borderRadius:8,padding:"12px 14px"}}>
                <div style={{fontWeight:600,marginBottom:4}}>{c.nom}</div>
                <div style={{fontSize:11,color:"var(--fg-3)",marginBottom:6}}>{c.code}</div>
                <div style={{fontSize:12,color:"var(--fg-2)"}}>
                  <div>Rev: {c.revenu > 0 ? c.revenu.toLocaleString("fr-FR")+" €" : "—"}</div>
                  <div>Chôm: {c.chomage > 0 ? c.chomage+"%" : "—"}</div>
                  <div>Densité: {c.densite > 0 ? c.densite+" /km²" : "—"}</div>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

// PAGE: PROJECTIONS 2027
// ══════════════════════════════════════════════════════════
function Projections() {
  const proj = React.useMemo(() => {
    return COMMUNES.map(c => {
      let p2027 = c.legi2024;
      // Simple trend: XD consolidated, Gauche momentum continues
      if (c.legi2022 !== "Extreme droite" && c.legi2024 === "Extreme droite") p2027 = "Extreme droite";
      else if (c.legi2024 === "Gauche") p2027 = "Gauche";
      return {...c, proj2027: p2027};
    });
  }, []);

  const dist2024 = {};
  const dist2027 = {};
  proj.forEach(c => {
    if (c.legi2024) dist2024[c.legi2024] = (dist2024[c.legi2024]||0)+1;
    if (c.proj2027) dist2027[c.proj2027] = (dist2027[c.proj2027]||0)+1;
  });

  const families = ["Extreme droite","Centre","Gauche","Gauche radicale","Droite","Ecologie","Divers"];
  const flips = proj.filter(c => c.legi2024 !== c.proj2027);

  return (
    <div>

        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>

          <div style={{fontSize:13,color:"var(--fg-2)"}}>
            <strong style={{color:"var(--warn)"}}>Projections indicatives</strong> — Basées sur une analyse de tendance 2017→2022→2024.
            Le modèle Random Forest (R²=0.859) est entraîné sur les législatives ; les projections 2027 sont des extrapolations.
          </div>
        </div>
      </div>

      <div className="two-col">
        <div className="card">
          <div className="card-title">Comparaison 2024 vs 2027 projeté</div>
          <div className="card-sub">Distribution des communes du Rhône</div>
          <div style={{display:"flex",flexDirection:"column",gap:10,marginTop:12}}>
            {families.filter(f=>dist2024[f]||dist2027[f]).map(f=>(
              <div key={f}>
                <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:4}}>
                  <FamilyPill family={f}/>
                </div>
                <div style={{display:"flex",gap:6,alignItems:"center"}}>
                  <span style={{fontSize:11,color:"var(--fg-3)",width:50}}>2024</span>
                  <div style={{flex:1,background:"var(--bg-surf)",borderRadius:3,height:6,overflow:"hidden"}}>
                    <AnimatedBar pct={((dist2024[f]||0)/280)*100} color={getFamilyColor(f)} delay={0}/>
                  </div>
                  <span style={{fontSize:12,fontWeight:600,width:30,textAlign:"right",fontVariantNumeric:"tabular-nums"}}>{dist2024[f]||0}</span>
                </div>
                <div style={{display:"flex",gap:6,alignItems:"center",marginTop:3}}>
                  <span style={{fontSize:11,color:"var(--fg-3)",width:50}}>2027</span>
                  <div style={{flex:1,background:"var(--bg-surf)",borderRadius:3,height:6,overflow:"hidden"}}>
                    <AnimatedBar pct={((dist2027[f]||0)/280)*100} color={getFamilyColor(f)+"99"} delay={80}/>
                  </div>
                  <span style={{fontSize:12,fontWeight:600,width:30,textAlign:"right",fontVariantNumeric:"tabular-nums"}}>{dist2027[f]||0}</span>
                </div>
              </div>
            ))}
          </div>
        </div>

        <div className="card">
          <div className="card-title">Basculements projetés 2024 → 2027</div>
          <div className="card-sub">{flips.length} commune{flips.length>1?"s":""} en transition</div>
          {flips.length === 0 ? (
            <p style={{color:"var(--fg-3)",fontSize:13,marginTop:12}}>Aucun basculement projeté avec le scénario de tendance actuel.</p>
          ) : (
            <div className="table-wrap" style={{marginTop:12}}>

                      <td><span style={{fontWeight:500}}>{c.nom}</span></td>
                      <td><FamilyPill family={c.legi2024}/></td>

          <table>
            <thead>
              <tr>
                <th>Commune</th>
